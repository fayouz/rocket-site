name: Déploiement OVH

# Publie public/ sur l'hébergement OVH (FTP) à chaque push sur main.
# Secrets à créer dans le dépôt : OVH_FTP_SERVER, OVH_FTP_USERNAME, OVH_FTP_PASSWORD (et OVH_FTP_DIR, ex. www/).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ secrets.OVH_FTP_DIR }}
